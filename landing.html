<!DOCTYPE html>
<html>
<head>
    <title>Welcome to El Nido Haven</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hotel-photo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .promotion {
            position: relative;
            width: 650px;
            padding: 20px 30px;
            background-color: rgba(255, 243, 247, 0.72);
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.20);
            text-align: center;
            z-index: 1;
        }

        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 5px;
        }

        .landing-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .promotion h1 {
            color: #f1357d;
            font-size: 36px;
            margin: 0;
        }

        .promotion h2 {
            color: #FF8C42;
            font-size: 21px;
            margin: 8px 0 15px;
        }

        .promotion p {
            color: #444;
            font-size: 16px;
            line-height: 1.5;
            margin: 8px 0;
        }

        .offer {
            color: #f1357d !important;
            font-weight: bold;
            font-size: 18px !important;
            margin-top: 15px !important;
        }

        .room {
            color: #555;
            margin-top: 5px !important;
        }

        .price {
            color: #FD821A;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            background-color: #f1357d;
            color: white;
            padding: 11px 28px;
            margin-top: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
        }

        .button:hover {
            background-color: #FD821A;
        }
    </style>
</head>

<body>

    <section class="hero">

        <img src="C:\Users\freshelle\Downloads\hotels.png" alt="El Nido Haven Hotel" class="hotel-photo">

        <div class="promotion">

            <div class="title">
                <img src="logo.png" alt="El Nido Haven Logo" class="landing-logo">

                <h1>
                    El Nido Haven ❀
                </h1>
            </div>

            <h2>
                Your Tropical Getaway!
            </h2>

            <p>
                Relax, unwind, and enjoy a peaceful tropical escape
                surrounded by beautiful views and comfortable rooms.
            </p>

            <p class="offer">
                °‧ 𓆝 SPECIAL PROMOTION 𓆞 ·｡
            </p>

            <p class="room">
                Tropical Garden Deluxe —
                <span class="price">₱4,500 / night</span>
            </p>

            <a href="index.html" class="button">
                Explore El Nido Haven
            </a>

        </div>

    </section>

</body>
</html>

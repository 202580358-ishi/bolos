<!DOCTYPE html>

<html>

<head>


<title>Register - El Nido Haven</title>

<style>

    body {
        margin: 0;
        background-color: #FFF3F7;
    }

    header {
        background-color: #FFD1E1;
        padding: 10px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo-container {
        display: flex;
        align-items: center;
    }

    .logo {
        width: 150px;
        height: 150px;
        margin-right: 10px;
    }

    .name {
        color: #f1357d;
        font-size: 22px;
        font-weight: bold;
    }

    nav a {
        color: #FD821A;
        text-decoration: none;
        margin-left: 20px;
        font-weight: bold;
    }

    #register {
        text-align: center;
        padding: 50px 20px;
    }

    #register h1 {
        color: #f1357d;
        font-size: 35px;
    }

    .register-box {
        width: 400px;
        margin: 0 auto;
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(241, 53, 125, 0.2);
        text-align: left;
    }

    .register-box label {
        color: #f1357d;
        font-weight: bold;
    }

    .register-box input,
    .register-box select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #FFD1E1;
        border-radius: 8px;
    }

    .submit-button {
        background-color: #f1357d;
        color: white;
        padding: 10px 22px;
        border: none;
        border-radius: 20px;
        font-weight: bold;
        margin: 10px auto 0;
    }

    footer {
        background-color: #ff9c5a;
        padding: 30px;
        color: #f1357d;
        text-align: center;
    }

</style>


</head>

<body>

<header>


<div class="logo-container">

    <img
        class="logo"
        src="logo.png"
        alt="El Nido Haven Logo"
    >

    <div class="name">
        EL NIDO HAVEN ❀
    </div>

</div>

<nav>

    <a href="index.html">
        Home
    </a>

    <a href="about.html">
        About
    </a>

    <a href="register.html">
        Register
    </a>

    <a href="contact.html">
        Contact
    </a>

</nav>


</header>

<section id="register">


<h1>
    ⋆｡°✩ Register now! ✩°｡⋆
</h1>

<div class="register-box">

    <form>

        <label>
            Full Name
        </label>

        <input
            type="text"
            placeholder="Enter your full name"
        >


        <label>
            Email Address
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Contact Number
        </label>

        <input
            type="text"
            placeholder="Enter your contact number"
        >


        <label>
            Check-in Date
        </label>

        <input
            type="date"
        >


        <label>
            Check-out Date
        </label>

        <input
            type="date"
        >


        <label>
            Number of Guests
        </label>

        <input
            type="number"
            min="1"
            placeholder="Enter number of guests"
        >


        <label>
            Room
        </label>

        <select>

            <option>
                Tropical Garden Deluxe
            </option>

        </select>


        <button
            type="submit"
            class="submit-button"
        >
            Submit Registration
        </button>

    </form>

</div>


</section>

<footer>

<p>
    EL NIDO HAVEN
</p>

<p>
    Your tropical getaway!
</p>


</footer>

</body>

</html>
